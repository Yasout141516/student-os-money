<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>💰 Money OS</title>
<style>
  :root {
    --bg:#f4f5f9; --card:#fff; --ink:#1d1f2b; --muted:#6b7080; --line:#e6e8ef;
    --brand:#4f46e5; --brand2:#7c3aed; --ok:#0f9d76; --bad:#e5484d; --warn:#f08c00;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 4px 16px rgba(16,24,40,.06);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font:16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:480px; margin:0 auto; padding:16px 16px calc(96px + env(safe-area-inset-bottom)); }
  header { display:flex; align-items:center; justify-content:space-between; margin:4px 2px 14px; }
  h1 { font-size:20px; margin:0; letter-spacing:-.01em; }
  .pill { font-size:12px; font-weight:600; color:var(--muted); background:#fff; border:1px solid var(--line); border-radius:999px; padding:5px 10px; }
  .hero { background:linear-gradient(135deg, var(--brand), var(--brand2)); color:#fff; border-radius:22px; padding:20px; margin-bottom:16px; box-shadow:0 10px 30px rgba(79,70,229,.30); }
  .hero .label { color:rgba(255,255,255,.8); }
  .hero .big { font-size:46px; font-weight:800; letter-spacing:-.02em; margin:2px 0 12px; font-variant-numeric:tabular-nums; }
  .hero .big.neg { color:#ffd0d2; }
  .bar { height:8px; background:rgba(255,255,255,.25); border-radius:99px; overflow:hidden; }
  .bar > i { display:block; height:100%; width:0; background:#fff; border-radius:99px; transition:width .5s ease; }
  .bar.hot > i { background:#ffb4b6; }
  .hero .sub { color:rgba(255,255,255,.85); display:flex; justify-content:space-between; margin-top:8px; font-size:13px; }
  .card { background:var(--card); border-radius:18px; padding:16px; margin-bottom:14px; box-shadow:var(--shadow); }
  .label { color:var(--muted); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; }
  .card-title { font-size:16px; font-weight:700; margin:0 0 12px; display:flex; align-items:center; gap:8px; }
  .sub { color:var(--muted); font-size:14px; }
  .grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; }
  #buttons button { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:14px 6px; min-height:84px; font-size:14px; font-weight:600; border-radius:16px; background:#f7f7fb; border:1px solid var(--line); }
  #buttons button .em { font-size:28px; line-height:1; }
  #buttons button .amt { font-size:12px; color:var(--muted); font-weight:600; }
  #buttons button.fixed { background:#eef0ff; border-color:#d9dcff; }
  button { font:inherit; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:14px; padding:14px 12px; font-size:16px; font-weight:600; cursor:pointer; transition:transform .08s, background .15s; }
  button:active { transform:scale(.96); }
  button:disabled { opacity:.6; }
  button.primary { background:var(--ink); color:#fff; border-color:var(--ink); }
  button.brand { background:var(--brand); color:#fff; border-color:var(--brand); }
  input, select, textarea { font:inherit; width:100%; padding:13px 14px; border:1px solid var(--line); border-radius:12px; font-size:17px; background:#fafafd; color:var(--ink); outline:none; transition:border-color .15s, box-shadow .15s; }
  input:focus, select:focus, textarea:focus { border-color:var(--brand); box-shadow:0 0 0 3px rgba(79,70,229,.15); background:#fff; }
  textarea { font-size:14px; min-height:96px; resize:vertical; }
  .row { display:flex; gap:10px; margin-top:10px; }
  .row > * { flex:1; }
  .hidden { display:none !important; }
  .panel { margin-top:12px; padding:12px; border-radius:14px; background:#f7f7fb; }
  .verdict { padding:12px 14px; border-radius:12px; font-weight:600; background:#f1f2f6; }
  .verdict.yes { background:#e6f7f1; color:#0b6b51; }
  .verdict.no { background:#fdecec; color:#a32025; }
  ul.coach { list-style:none; padding:0; margin:12px 0 0; }
  ul.coach li { padding:10px 12px; margin:8px 0; background:#f7f7fb; border-radius:12px; font-size:14px; }
  ul.coach li:first-child { background:#fff7db; font-weight:600; }
  #toast { position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); transform:translate(-50%, 12px); background:var(--ink); color:#fff; padding:13px 18px; border-radius:14px; max-width:92%; width:max-content; font-weight:600; font-size:15px; opacity:0; transition:opacity .2s, transform .2s; pointer-events:none; box-shadow:0 8px 24px rgba(0,0,0,.2); z-index:10; }
  #toast.show { opacity:1; transform:translate(-50%, 0); }
  #toast.err { background:var(--bad); }
  #toast.warn { background:var(--warn); }
  a { color:var(--brand); font-weight:600; text-decoration:none; }
  .foot { text-align:center; margin-top:6px; }
  .foot a { color:var(--muted); font-weight:500; font-size:13px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>💰 Money OS</h1>
    <span class="pill" id="month"></span>
  </header>

  <section class="hero">
    <div class="label">Left to spend this month</div>
    <div class="big" id="left">…</div>
    <div class="bar" id="bar"><i></i></div>
    <div class="sub"><span id="spent"></span><span id="pct"></span></div>
  </section>

  <section class="card">
    <h2 class="card-title">⚡ Quick add</h2>
    <div class="grid" id="buttons"></div>
    <div id="amountPanel" class="hidden panel">
      <div class="sub" id="amountTitle"></div>
      <div class="row">
        <input id="amount" type="number" inputmode="numeric" min="1" placeholder="Amount ৳">
      </div>
      <div class="row">
        <button id="cancelAmount">Cancel</button>
        <button id="saveAmount" class="brand">Add</button>
      </div>
    </div>
  </section>

  <section class="card">
    <h2 class="card-title">💸 Can I afford it?</h2>
    <div class="row" style="margin-top:0"><input id="affItem" placeholder="What is it? e.g. Headphones"></div>
    <div class="row">
      <input id="affPrice" type="number" inputmode="numeric" min="1" placeholder="Price ৳">
      <button id="affCheck" class="primary" style="flex:0 0 96px">Check</button>
    </div>
    <div id="affResult" class="hidden" style="margin-top:12px">
      <div id="affLine" class="verdict"></div>
      <div class="row"><button id="affSave">⭐ Add to Wishlist</button></div>
      <div class="sub" id="affLink" style="margin-top:8px"></div>
    </div>
  </section>

  <section class="card">
    <h2 class="card-title">📩 Paste bKash SMS</h2>
    <textarea id="smsText" placeholder="You have paid Tk 250.00 to Pathao Ltd. Fee Tk 0.00. TrxID …"></textarea>
    <div class="row"><button id="readSms">Read SMS</button></div>
    <div id="smsPreview" class="hidden panel">
      <div class="sub" id="smsNote"></div>
      <div class="row"><input id="smsAmount" type="number" inputmode="decimal" min="1" placeholder="Amount ৳"></div>
      <div class="row"><input id="smsName" placeholder="What was it?"></div>
      <div class="row"><select id="smsCategory"></select></div>
      <div class="row">
        <button id="smsCancel">Cancel</button>
        <button id="smsSave" class="brand">Save to Notion</button>
      </div>
    </div>
  </section>

  <section class="card">
    <h2 class="card-title">🧠 Money Coach</h2>
    <button id="coachBtn" class="primary" style="width:100%">🧠 Refresh coach</button>
    <ul id="coachLines" class="coach"></ul>
    <div class="sub" id="coachLink"></div>
  </section>

  <div class="foot"><a href="#" id="resetPin">Change PIN</a></div>
</main>
<div id="toast"></div>

<script type="module">
import { parseSms, guessCategory } from './sms.js';
const CATS = {
  snacks: '🥤 Snacks & Drinks', rides: '🚗 Rides', food: '🍛 Food', study: '📚 Study', other: '🎁 Other',
};
const BUTTONS = [
  { label: '🥤 Coke ৳40', name: 'Coke', category: CATS.snacks, amount: 40 },
  { label: '🚗 Ride', name: 'Ride', category: CATS.rides },
  { label: '🍛 Food', name: 'Food', category: CATS.food },
  { label: '📚 Study', name: 'Study', category: CATS.study },
  { label: '🎁 Other', name: 'Other', category: CATS.other },
];
const $ = (id) => document.getElementById(id);
const taka = (n) => `${Math.round(n) < 0 ? '-' : ''}৳${Math.abs(Math.round(n)).toLocaleString('en-US')}`;

const store = {
  get() { try { return localStorage.getItem('money-pin') || ''; } catch { return this.mem || ''; } },
  set(v) { this.mem = v; try { localStorage.setItem('money-pin', v); } catch {} },
  clear() { this.mem = ''; try { localStorage.removeItem('money-pin'); } catch {} },
};
function pin() {
  let p = store.get();
  while (!p) { p = (prompt('Enter your Money OS PIN') || '').trim(); if (p) store.set(p); else break; }
  return p;
}

let toastTimer;
function toast(msg, err = false) {
  const t = $('toast');
  const kind = err === true ? 'err' : err || '';
  t.textContent = msg; t.className = `show ${kind}`;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.className = ''), kind ? 5000 : 3000);
}

async function api(path, body) {
  let res;
  try {
    res = await fetch(`/api/${path}`, {
      method: body ? 'POST' : 'GET',
      headers: { 'x-pin': pin(), 'content-type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch { throw new Error('No connection. Check your internet and try again.'); }
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { store.clear(); throw new Error('Wrong PIN. Tap again to re-enter it.'); }
  if (!res.ok) throw new Error(data.error || `Something went wrong (${res.status}).`);
  return data;
}

let lastSpent, lastIncome;
function showLeft(left, spent) {
  $('left').textContent = taka(left);
  $('left').classList.toggle('neg', left < 0);
  if (spent !== undefined) { lastSpent = spent; lastIncome = spent + left; }
  else if (lastIncome !== undefined) lastSpent = lastIncome - left;
  if (lastSpent === undefined) return;
  const pct = lastIncome > 0 ? Math.round((lastSpent / lastIncome) * 100) : 100;
  $('spent').textContent = `Spent ${taka(lastSpent)}`;
  $('pct').textContent = `${pct}% of ${taka(lastIncome)} income`;
  $('bar').firstElementChild.style.width = `${Math.min(pct, 100)}%`;
  $('bar').classList.toggle('hot', pct >= 80);
}

async function refresh() {
  try { const s = await api('summary'); showLeft(s.leftToSpend, s.spentThisMonth); }
  catch (e) { $('left').textContent = '—'; toast(e.message, true); }
}

let busy = false;
async function add(item) {
  if (busy) return; busy = true;
  try {
    const r = await api('add', item);
    showLeft(r.leftToSpend);
    const b = r.budget;
    if (b?.over) toast(`${b.category}: ${taka(b.overBy)} over budget (${b.pct}%)`, 'err');
    else if (b?.pct >= 80) toast(`${b.category}: ${b.pct}% of budget used`, 'warn');
    else toast(`Added ${item.label ?? item.name} ${taka(item.amount)}`);
    setTimeout(refresh, 6000);
    return true;
  } catch (e) { toast(e.message, true); return false; }
  finally { busy = false; }
}

let pending = null;
for (const b of BUTTONS) {
  const el = document.createElement('button');
  const [em, ...rest] = b.label.split(' ');
  const txt = rest.join(' ').replace(/\s*৳\d+$/, '');
  el.innerHTML = `<span class="em">${em}</span><span>${txt}</span>${b.amount ? `<span class="amt">৳${b.amount}</span>` : ''}`;
  if (b.amount) el.classList.add('fixed');
  el.onclick = () => {
    if (b.amount) return add({ name: b.name, category: b.category, amount: b.amount, label: '🥤 Coke' });
    pending = b;
    $('amountTitle').textContent = `${b.label}: how much?`;
    $('amountPanel').classList.remove('hidden');
    $('amount').value = ''; $('amount').focus();
  };
  $('buttons').appendChild(el);
}
$('cancelAmount').onclick = () => { pending = null; $('amountPanel').classList.add('hidden'); };
$('saveAmount').onclick = async () => {
  const amount = Number($('amount').value);
  if (!pending || !(amount > 0)) return toast('Enter an amount above ৳0.', true);
  if (await add({ name: pending.name, category: pending.category, amount, label: pending.label })) {
    pending = null; $('amountPanel').classList.add('hidden');
  }
};
$('amount').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('saveAmount').click(); });

$('coachBtn').onclick = async () => {
  $('coachBtn').disabled = true; $('coachBtn').textContent = '🧠 Thinking…';
  try {
    const { lines, url } = await api('coach', {});
    $('coachLines').innerHTML = '';
    for (const l of lines) { const li = document.createElement('li'); li.textContent = l; $('coachLines').appendChild(li); }
    $('coachLink').innerHTML = '';
    const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.textContent = 'Open in Notion →';
    $('coachLink').appendChild(a);
  } catch (e) { toast(e.message, true); }
  finally { $('coachBtn').disabled = false; $('coachBtn').textContent = '🧠 Refresh coach'; }
};
$('affCheck').onclick = async () => {
  const price = Number($('affPrice').value);
  if (!(price > 0)) return toast('Enter a price above ৳0', true);
  $('affLink').innerHTML = '';
  try {
    const r = await api('afford', { item: $('affItem').value, price });
    $('affLine').textContent = r.line;
    $('affLine').className = `verdict ${r.verdict || 'no'}`;
    $('affResult').classList.remove('hidden');
    $('affSave').classList.toggle('hidden', !r.verdict);
  } catch (e) { toast(e.message, true); }
};
$('affSave').onclick = async () => {
  const price = Number($('affPrice').value);
  if (!(price > 0)) return toast('Enter a price above ৳0', true);
  $('affSave').disabled = true;
  try {
    const r = await api('afford', { item: $('affItem').value || 'Wishlist item', price, save: true });
    $('affLine').textContent = r.line;
    const a = document.createElement('a'); a.href = r.url; a.target = '_blank'; a.textContent = 'Saved to Wishlist: open in Notion →';
    $('affLink').innerHTML = ''; $('affLink').appendChild(a);
    toast('⭐ Added to Wishlist');
  } catch (e) { toast(e.message, true); }
  finally { $('affSave').disabled = false; }
};
$('resetPin').onclick = (e) => { e.preventDefault(); store.clear(); pin(); refresh(); };

const ALL_CATS = ['🥤 Snacks & Drinks', '🚗 Rides', '📺 Subscriptions', '🍛 Food', '📚 Study', '🎁 Other'];
for (const c of ALL_CATS) $('smsCategory').add(new Option(c, c));
$('readSms').onclick = () => {
  const r = parseSms($('smsText').value);
  $('smsPreview').classList.remove('hidden');
  $('smsSave').classList.remove('hidden');
  if (r.kind === 'unknown') {
    $('smsNote').textContent = "Couldn't read this SMS — enter it manually.";
    $('smsAmount').value = ''; $('smsName').value = ''; $('smsCategory').value = '🎁 Other';
  } else if (r.kind === 'received') {
    $('smsNote').textContent = `Money received: ${taka(r.amount)}${r.merchant ? ` from ${r.merchant}` : ''}. Log it in Notion's Income database.`;
    $('smsSave').classList.add('hidden');
    $('smsAmount').value = r.amount; $('smsName').value = r.merchant || '';
  } else {
    $('smsNote').textContent = `Check and edit, then save.${r.trxId ? ` TrxID ${r.trxId}` : ''}`;
    $('smsAmount').value = r.amount; $('smsName').value = r.merchant || 'bKash payment';
    $('smsCategory').value = guessCategory(r.merchant);
  }
};
$('smsCancel').onclick = () => $('smsPreview').classList.add('hidden');
$('smsSave').onclick = async () => {
  const amount = Number($('smsAmount').value);
  const name = $('smsName').value.trim();
  if (!(amount > 0) || !name) return toast('Enter a name and an amount above ৳0.', true);
  if (await add({ name, amount, category: $('smsCategory').value, paidWith: 'bKash' })) {
    $('smsPreview').classList.add('hidden'); $('smsText').value = '';
  }
};

$('month').textContent = new Date().toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
refresh();
</script>
</body>
</html>
